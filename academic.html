<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Borui Hu's current reading and teaching in partial differential equations.">
    <meta name="color-scheme" content="light">
    <title>Academic · Borui Hu</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=13">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        <a class="site-name" href="index.html" lang="en">Borui Hu</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="academic.html" aria-current="page">Academic</a>
          <a href="life.html">Life</a>
        </nav>
        <nav class="academic-subnav" aria-label="Academic sections">
          <button type="button" class="is-active" aria-pressed="true" aria-controls="research-panel" data-panel="research-panel">Research</button>
          <button type="button" aria-pressed="false" aria-controls="teaching-panel" data-panel="teaching-panel">Teaching</button>
          <button type="button" aria-pressed="false" aria-controls="student-panel" data-panel="student-panel">Studies</button>
        </nav>
      </header>
      <main class="page" id="main" tabindex="-1">
        <section id="research-panel" class="academic-panel" aria-label="Research">
          <h1 class="page-title">Current Reading</h1>
          <div class="study-list" aria-label="Current reading">
            <section class="study-item" aria-labelledby="pde-title">
              <h2 id="pde-title">Partial Differential Equations</h2>
              <div class="study-detail">
                <p class="book-title" lang="en"><a href="https://link.springer.com/book/10.1007/978-1-4612-2578-2"><cite>Blowup for Nonlinear Hyperbolic Equations</cite></a></p>
                <p class="book-author" lang="en">Serge Alinhac</p>
              </div>
            </section>
          </div>
        </section>
        <section id="teaching-panel" class="academic-panel" aria-label="Teaching" hidden>
          <h1 class="page-title">Teaching Assistantships</h1>
          <div class="study-list" aria-label="Current teaching assistantships">
            <a class="study-item teaching-item" href="https://www.zhangjy9610.me/2026F-PDE1.html"><span class="course-term">Fall 2026</span><span class="course-name">Partial Differential Equations</span></a>
          </div>
        </section>
        <section id="student-panel" class="academic-panel" aria-label="Studies" hidden></section>
      </main>
    </div>
    <script>
      const sectionButtons = document.querySelectorAll(".academic-subnav button");
      const sectionPanels = document.querySelectorAll(".academic-panel");

      sectionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const panelId = button.dataset.panel;
          sectionButtons.forEach((item) => {
            const active = item === button;
            item.classList.toggle("is-active", active);
            item.setAttribute("aria-pressed", String(active));
          });
          sectionPanels.forEach((panel) => {
            panel.hidden = panel.id !== panelId;
          });
        });
      });
    </script>
  </body>
</html>
