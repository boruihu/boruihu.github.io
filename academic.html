<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="胡博睿正在学习的内容：偏微分方程与最优传输。">
    <meta name="color-scheme" content="light">
    <title>学术 · 胡博睿</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=10">
  </head>
  <body>
    <a class="skip-link" href="#main">跳至正文</a>
    <div class="site">
      <header class="site-header">
        <a class="site-name" href="index.html" lang="en">Borui Hu</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="academic.html" aria-current="page">学术</a>
          <a href="life.html">生活</a>
        </nav>
        <nav class="academic-subnav" aria-label="学术栏目">
          <button type="button" class="is-active" aria-selected="true" data-panel="research-panel">科研</button>
          <button type="button" aria-selected="false" data-panel="teaching-panel">助教</button>
          <button type="button" aria-selected="false" data-panel="student-panel">学生</button>
        </nav>
      </header>
      <main class="page" id="main" tabindex="-1">
        <section id="research-panel" class="academic-panel" aria-label="科研">
          <h1 class="page-title">正在学习</h1>
          <div class="study-list" aria-label="正在学习的内容">
            <section class="study-item" aria-labelledby="pde-title">
              <h2 id="pde-title">偏微分方程</h2>
              <div class="study-detail">
                <p class="book-title" lang="en"><a href="https://link.springer.com/book/10.1007/978-1-4612-2578-2"><cite>Blowup for Nonlinear Hyperbolic Equations</cite></a></p>
                <p class="book-author" lang="en">Serge Alinhac</p>
              </div>
            </section>
          </div>
        </section>
        <section id="teaching-panel" class="academic-panel" aria-label="助教" hidden>
          <h1 class="page-title teaching-title">正在担任以下课程助教</h1>
          <div class="study-list" aria-label="正在担任助教的课程">
            <a class="study-item teaching-item" href="https://www.zhangjy9610.me/2026F-PDE1.html">2026秋 偏微分方程</a>
          </div>
        </section>
        <section id="student-panel" class="academic-panel" aria-label="学生" hidden></section>
      </main>
    </div>
    <script>
      const sectionButtons = document.querySelectorAll(".academic-subnav button");
      const sectionPanels = document.querySelectorAll(".academic-panel");

      sectionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const panelId = button.dataset.panel;
          sectionButtons.forEach((item) => {
            const active = item === button;
            item.classList.toggle("is-active", active);
            item.setAttribute("aria-selected", String(active));
          });
          sectionPanels.forEach((panel) => {
            panel.hidden = panel.id !== panelId;
          });
        });
      });
    </script>
  </body>
</html>
